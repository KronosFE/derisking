name: deposit-status
# Daily check that every public deposit of the open record still resolves; writes data/deposit_status.json.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_deposits.py
      - name: Commit status
        run: |
          git config user.name "Kronos Fusion Energy"
          git config user.email "noreply@kronosfusionenergy.com"
          git add data/deposit_status.json
          git diff --cached --quiet || git commit -m "data: deposit status $(date -u +%Y-%m-%d)"
          git push
